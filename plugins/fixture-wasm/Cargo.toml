[package]
name = "smithagents-plugin-fixture-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

# Only the wasm32 build has content, so native workspace builds pull in
# neither the guest bindings nor the fixture.
[target.'cfg(target_arch = "wasm32")'.dependencies]
smithagents-plugin-protocol = { path = "../../crates/plugin-protocol", features = ["wasm-guest"] }
smithagents-plugin-fixture = { path = "../fixture" }
