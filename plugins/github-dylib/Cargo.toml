[package]
name = "smithagents-plugin-github-dylib"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "smithagents_plugin_github_dylib"
crate-type = ["cdylib"]

[dependencies]
smithagents-plugin-protocol = { path = "../../crates/plugin-protocol", features = ["dylib"] }
smithagents-plugin-github = { path = "../github" }
# `export_dylib_plugin!` uses `#[stabby::export]`, which looks `stabby` up by
# name in this crate's dependencies.
stabby.workspace = true
