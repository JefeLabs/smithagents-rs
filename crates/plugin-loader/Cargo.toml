[package]
name = "smithagents-plugin-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The one crate allowed `unsafe`: loading a library and fetching its entry
# cannot be done without it. Each use carries its own allowance.
[lints.rust]
unsafe_code = "deny"

[dependencies]
smithagents-plugin-protocol = { path = "../plugin-protocol", features = ["dylib"] }
libloading.workspace = true
stabby = { workspace = true, features = ["libloading"] }
thiserror.workspace = true

[dev-dependencies]
smithagents-plugins-tool = { path = "../../tools/plugins" }
serde_json.workspace = true
tempfile.workspace = true
