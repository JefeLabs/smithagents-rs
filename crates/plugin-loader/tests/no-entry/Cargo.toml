# A native library without the plugin entry, for the loader's tests. Not a
# member of the main workspace: `[workspace]` below makes it its own root.
# `smithagents_plugins_tool::pack_library` builds a copy of it.
[package]
name = "smithagents-test-no-entry"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "smithagents_test_no_entry"
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "forbid"

[workspace]
