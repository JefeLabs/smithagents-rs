[package]
name = "host-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "host-desktop"
path = "src/main.rs"

[dependencies]
smithagents-app = { path = "../app" }
smithagents-core = { path = "../core" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The feature that makes `init()` forward the `log` crate's records, on in
# test builds so the test of `init_logging` means something: logging must not
# forward them even when a dependency turns it on.
tracing-subscriber = { workspace = true, features = ["tracing-log"] }
log = "0.4"
