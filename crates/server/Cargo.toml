[package]
name = "smithagents-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smithagents-core = { path = "../core" }
smithagents-plugin-protocol = { path = "../plugin-protocol" }
smithagents-plugin-host = { path = "../plugin-host" }
sqlx = { workspace = true, features = ["macros"] }
serde.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
tokio-stream.workspace = true
futures.workspace = true
axum.workspace = true
subtle.workspace = true
fs2.workspace = true
rand.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }
tracing-subscriber.workspace = true
tower-http.workspace = true

[features]
test-util = []

[[bin]]
name = "smithagentsd"
path = "src/bin/smithagentsd.rs"

[[test]]
name = "api"
path = "tests/api.rs"
required-features = ["test-util"]

[dev-dependencies]
smithagents-plugin-fixture = { path = "../../plugins/fixture" }
smithagents-plugin-github = { path = "../../plugins/github" }
smithagents-client = { path = "../client" }
smithagents-plugins-tool = { path = "../../tools/plugins" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true

[[test]]
name = "intents"
path = "tests/intents.rs"
required-features = ["test-util"]

[[test]]
name = "feedback_repo"
path = "tests/feedback_repo.rs"
required-features = ["test-util"]

[[test]]
name = "feedback_api"
path = "tests/feedback_api.rs"
required-features = ["test-util"]

[[test]]
name = "queue"
path = "tests/queue.rs"
required-features = ["test-util"]

[[test]]
name = "plugin_store"
path = "tests/plugin_store.rs"
required-features = ["test-util"]

[[test]]
name = "plugin_manager"
path = "tests/plugin_manager.rs"
required-features = ["test-util"]

[[test]]
name = "plugin_api"
path = "tests/plugin_api.rs"
required-features = ["test-util"]

[[test]]
name = "plugin_e2e"
path = "tests/plugin_e2e.rs"
required-features = ["test-util"]
