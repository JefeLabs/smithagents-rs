[package]
name = "smithagents-plugin-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The guest side of the WebAssembly contract: bindings for `wit/plugin.wit`
# and `export_wasm_plugin!`. Only plugin crates built for wasm32 enable it.
wasm-guest = ["dep:wit-bindgen"]
# The native side of the contract: the stabby interfaces both sides of the
# dylib boundary build against, and `export_dylib_plugin!`. The daemon and
# built-in plugin crates enable it.
dylib = ["dep:stabby"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
toml.workspace = true
semver.workspace = true
base64.workspace = true
url.workspace = true
wit-bindgen = { workspace = true, optional = true }
stabby = { workspace = true, optional = true }
