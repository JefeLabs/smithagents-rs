[package]
name = "smithagents-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Default features: `component` (gpui-component), `assets`, and `x11` (a no-op
# on macOS). gpui-kit itself turns on the platform crate's `runtime_shaders`,
# so no Xcode `metal` compiler is needed at build time.
gpui-kit.workspace = true
smithagents-core = { path = "../core" }
futures.workspace = true
smithagents-client = { path = "../client" }
smithagents-theme = { path = "../theme" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
