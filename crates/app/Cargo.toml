[package]
name = "smithagents-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Default features: `component` (gpui-component), `assets`, and `x11` (a no-op
# on macOS). gpui-kit itself turns on the platform crate's `runtime_shaders`,
# so no Xcode `metal` compiler is needed at build time.
gpui-kit.workspace = true
smithagents-core = { path = "../core" }
futures.workspace = true
smithagents-client = { path = "../client" }
smithagents-theme = { path = "../theme" }
smithagents-center-host = { path = "../center-host" }
# The window handle the center tab host attaches to (`CenterTabHost::attach`).
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
# Headless GPUI windows for the shell smoke test (`#[gpui_kit::test]`).
gpui-kit = { workspace = true, features = ["test-support"] }
chrono.workspace = true
tempfile.workspace = true
# Only to build the client's transport errors in the view-model tests.
reqwest.workspace = true
tokio-tungstenite.workspace = true
# Captures log output to check that no token is ever logged.
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }
