[package]
name = "smithagents-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
xcap.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The Screen Recording permission check and request (safe functions).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }

[dev-dependencies]
# The manual test writes the capture as a PNG into a kept temporary directory.
image.workspace = true
tempfile.workspace = true
