[package]
name = "smithagents-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smithagents-plugin-protocol = { path = "../plugin-protocol", features = ["dylib"] }
smithagents-plugin-loader = { path = "../plugin-loader" }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# Plugins reach public HTTPS APIs, so this crate adds a rustls backend; the
# workspace entry stays TLS-free for the loopback-only client.
reqwest = { workspace = true, features = ["rustls"] }
semver.workspace = true
serde_json.workspace = true
stabby.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-io.workspace = true

[target.'cfg(unix)'.dependencies]
# Tool commands: the effective user (who may own what is run) and killing a
# command's process group when it times out.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
smithagents-plugin-fixture = { path = "../../plugins/fixture" }
smithagents-plugins-tool = { path = "../../tools/plugins" }
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
