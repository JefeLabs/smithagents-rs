[workspace]
members = ["crates/*", "plugins/*", "tools/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
fs2 = "0.4.3"
subtle = "2.6.1"
rand = "0.10.4"
# The client speaks plain HTTP to 127.0.0.1 only: no TLS backend, no OS proxy settings.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30.0"
rustix = "1.1.6"
tempfile = "3.27.0"
async-trait = "0.1.92"
futures = "0.3.34"
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["cors"] }
tower = "0.5.3"
http-body-util = "0.1.5"
regex = "1.13.2"
ignore = "0.4.35"
# Native UI: gpui-kit re-exports GPUI (the `gpui-pre` snapshot it pins with `=`)
# plus gpui-component. Releases break APIs weekly: pin exactly, upgrade on purpose.
gpui-kit = "=0.11.0"
signal-hook = "0.4.6"
# Already in the lock through GPUI; the app uses it for agent initials.
unicode-segmentation = "1.13.3"
raw-window-handle = "=0.6.2"
url = "=2.5.9"
toml = "1.2.3"
semver = { version = "1.0.28", features = ["serde"] }
base64 = "0.23.1"
# The plugin sandbox. Pinned exactly: their embedding APIs change every release.
# Only what the runtime uses is enabled; Cranelift dominates the build time.
wasmtime = { version = "=51.0.0", default-features = false, features = ["async", "cache", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=51.0.0", default-features = false, features = ["p2"] }
wasmtime-wasi-io = "=51.0.0"
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc", "std"] }
# Built-in native plugins: an ABI-stable interface checked at load. Pinned
# exactly: host and plugins must agree on stabby's type reports.
stabby = "=72.1.16"
libloading = "0.9"
